name: React deploy test

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-deploy-development
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mail-scheduler-frontend
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('mail-scheduler-frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: mail-scheduler-frontend/dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: [self-hosted, windows, development]
    timeout-minutes: 10
    environment: development
    env:
      DEPLOY_PATH: D:\mail-scheduler
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: ./dist

      - name: Copy to local folder
        shell: powershell
        run: |
          robocopy ./dist $env:DEPLOY_PATH /MIR /NFL /NDL /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy falló: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0